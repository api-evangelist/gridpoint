description: >-
  GridPoint runs a real, public application status page and nothing else in this
  category. There is no published API versioning scheme, no deprecation policy,
  no Sunset/Deprecation (RFC 8594) commitment, no changelog and no numeric
  uptime SLA reachable without a customer agreement — consistent with a company
  that publishes no API contract at all.
