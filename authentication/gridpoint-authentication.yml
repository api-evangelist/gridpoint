  JavaScript (window._oauthBaseUrl = "https://identity.gridpoint.com/identity/"
  in https://ems.gridpoint.com/assets/javascripts/services/apiService.js), which
  shows the application exchanging and refreshing OAuth 2.0 access/refresh
  tokens against that endpoint. Nothing here was inferred from marketing copy.
