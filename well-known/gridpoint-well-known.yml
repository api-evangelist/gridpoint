generated: '2026-08-22'
method: probed
source: >-
  Direct HTTP probes, 2026-08-22, of every GridPoint host reachable without
  credentials: the marketing site (www.gridpoint.com), the customer knowledge
  base (knowledge.gridpoint.com), the HubSpot resources/blog host
  (resources.gridpoint.com), the GridPoint Energy Manager application
  (ems.gridpoint.com), the legacy Energy portal (energy.gridpoint.com), the
  OAuth entry point the Energy Manager app is configured against
  (identity.gridpoint.com, from window._oauthBaseUrl in the app's own
  apiService.js) and the ORY Hydra authorization server it resolves to
  (hydra.gridpoint.com).
description: >-
  GridPoint publishes no security.txt, api-catalog or ai-plugin.json anywhere.
  It DOES serve real, anonymous OpenID Connect discovery: identical
  openid-configuration documents are returned by hydra.gridpoint.com,
  identity.gridpoint.com and ems.gridpoint.com, all naming the same issuer
  (https://hydra.gridpoint.com:443/), plus a live JWKS. Those two documents are
  the only machine-readable API artifacts GridPoint publishes publicly and are
  saved here verbatim. energy.gridpoint.com answers 403 to every automated
  request including the site root's own paths, so its /.well-known/ surface is
  recorded as unreadable rather than absent.
hosts:
  - host: https://hydra.gridpoint.com
    documents:
      - path: /.well-known/openid-configuration
        status: 200
        type: application/json
        file: gridpoint-openid-configuration.json
      - path: /.well-known/jwks.json
        status: 200
        type: application/json
        file: gridpoint-jwks.json
      - path: /.well-known/oauth-authorization-server
