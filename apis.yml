  reason: customer-only-docs
  detail: >-
    GridPoint has no developer surface at all — developer/docs/api.gridpoint.com
    do not resolve and knowledge.gridpoint.com is hardware troubleshooting — yet
    its own ORY Hydra authorization server anonymously advertises the
    client_credentials grant plus ROLE_PARTNER_* and ROLE_SYSTEM scopes, so the
    API exists and is reachable only by an authenticated customer or
    commissioning partner.
