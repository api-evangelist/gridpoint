aid: gridpoint
name: GridPoint
description: >-
  GridPoint is a Reston, Virginia clean-technology company, founded in 2003, that
  builds energy management and sustainability systems for commercial buildings,
  enterprises and government agencies. It combines its own edge hardware — EC2000
  and Edge controllers, submeters, thermostats, lighting control panels and
  BACnet/Modbus gateways — with the cloud-based GridPoint Energy Manager
  analytics platform, delivering HVAC and lighting automation, equipment-level
  submetering, refrigeration monitoring, demand management, grid services and
  carbon/sustainability reporting for multi-site portfolios in retail,
  convenience, restaurant, automotive and public-sector estates. GridPoint sells
  the platform as a subscription service and integrates with existing building
  assets rather than requiring a rip-and-replace. It operates a customer
  application, a partner commissioning channel and a public knowledge base, but
  publishes no developer portal, no API reference and no machine-readable API
  contract; the only machine-readable artifacts it serves anonymously are the
  OpenID Connect discovery and JWKS documents of its own authorization server.
