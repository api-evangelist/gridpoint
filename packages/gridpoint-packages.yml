  a GridPoint client library and returned none.
description: >-
  IMPORTANT — READ THE `kind:` FIELD. GridPoint publishes NO API client SDK in
  any language. What it does publish, from its own GitHub organization, is a
  small set of general-purpose open-source Elixir/Nerves libraries that came out
  of building its edge firmware and its Phoenix web platform. These are real,
  first-party, currently-maintained packages, and they are recorded here as
  such — but they wrap nothing of GridPoint's API and cannot be used to call
  GridPoint. No `SDKs` pointer is emitted in apis.yml for that reason; counting
  them as SDKs would credit GridPoint with client libraries for an API it does
  not publish. The rest of the org's 29 repositories are forks of upstream
  projects (Zephyr, Nerves, linux-at91, libmodbus, fwup, zcbor) used in the
  controller firmware toolchain, not GridPoint packages.
